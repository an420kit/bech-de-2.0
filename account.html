<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1b"><title>My account — Bech De</title><style>
:root{--navy:#090d1b;--lime:#b8e83e;--ink:#151a27;--muted:#727988;--line:#e8eaf0}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font:15px/1.5 Inter,system-ui,Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.header{background:linear-gradient(110deg,#080b16,#121a30);padding:17px 0;color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:28px;font-weight:950;letter-spacing:-1.5px;color:white;text-decoration:none}.brand span{color:var(--lime)}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:850;cursor:pointer}.lime{background:var(--lime);color:#101526}.outline{background:#fff;border:1px solid var(--line)}main{padding:26px 0}.hero{background:var(--navy);color:white;padding:23px;border-radius:16px}.hero h1{margin:0;font-size:30px;letter-spacing:-1px}.hero p{color:#c5cad6;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:16px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.panel h2{font-size:17px;margin:0 0 12px}.muted{font-size:12px;color:var(--muted)}.item{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.item img{width:62px;height:62px;object-fit:cover;border-radius:9px;background:#eee}.item div{flex:1;min-width:0}.item strong{display:block;font-size:13px}.item a{font-size:12px;color:#245d9b;text-decoration:none}.notice{padding:13px;border-radius:10px;background:#eff8dc;font-size:12px;margin-top:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,140px);background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;transition:.2s}.toast.show{transform:translate(-50%,0)}@media(max-width:680px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head><body><header class="header"><div class="wrap row"><a class="brand" href="index.html">bech<span>de.</span></a><div><a class="btn lime" href="seller.html">＋ Sell item</a> <button class="btn outline" id="signOut">Sign out</button></div></div></header><main class="wrap"><section class="hero"><h1>My Bech De</h1><p id="welcome">Loading your account…</p><div><a class="btn lime" href="seller.html">Post a listing</a></div></section><div id="notice" class="notice" hidden></div><div class="grid"><section class="panel"><h2>My listings</h2><div id="myListings" class="muted">Loading…</div></section><section class="panel"><h2>My conversations</h2><div id="myConversations" class="muted">Loading…</div></section><section class="panel"><h2>My offers</h2><div id="myOffers" class="muted">Loading…</div></section><section class="panel"><h2>My bids</h2><div id="myBids" class="muted">Loading…</div></section></div></main><div id="toast" class="toast"></div><script src="assets/config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.BECHDE_CONFIG,ready=window.BECHDE_BACKEND_ENABLED,db=ready?createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+(Number(n||0)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
function show(id,html){$(id).innerHTML=html}
function empty(id,msg){show(id,'<p class="muted">'+esc(msg)+'</p>')}
async function run(){if(!ready){$('notice').hidden=false;$('notice').textContent='Supabase is not configured. Set assets/config.js and run the SQL migrations before using accounts.';empty('myListings','Backend not connected.');empty('myConversations','Backend not connected.');empty('myOffers','Backend not connected.');empty('myBids','Backend not connected.');return}
const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href='auth.html';return}
$('welcome').textContent='Signed in as '+user.email+'. Manage your listings and buyer conversations here.';
const [lr,cr,or,br]=await Promise.all([
db.from('listings').select('id,title,price_paise,status,photo_urls,created_at').eq('seller_id',user.id).order('created_at',{ascending:false}).limit(30),
db.from('conversations').select('id,listing_id,buyer_id,seller_id,last_message_at').or('buyer_id.eq.'+user.id+',seller_id.eq.'+user.id).order('last_message_at',{ascending:false}).limit(30),
db.from('price_offers').select('id,listing_id,amount_paise,status,created_at').eq('buyer_id',user.id).order('created_at',{ascending:false}).limit(30),
db.from('bids').select('id,listing_id,amount_paise,created_at').eq('bidder_id',user.id).order('created_at',{ascending:false}).limit(30)
]);
if(lr.error)empty('myListings',lr.error.message);else show('myListings',lr.data.length?lr.data.map(x=>'<div class="item">'+(x.photo_urls?.[0]?'<img src="'+esc(x.photo_urls[0])+'" alt="">':'')+'<div><strong>'+esc(x.title)+'</strong><span class="muted">'+money(x.price_paise)+' · '+esc(x.status)+'</span><br><a href="product.html?id='+encodeURIComponent(x.id)+'">View listing</a></div></div>').join(''):'<p class="muted">No listings yet.</p>');
if(cr.error)empty('myConversations',cr.error.message);else show('myConversations',cr.data.length?cr.data.map(x=>'<div class="item"><div><strong>Conversation about a listing</strong><span class="muted">'+new Date(x.last_message_at).toLocaleString()+'</span><br><a href="messages.html?id='+encodeURIComponent(x.id)+'">Open chat</a></div></div>').join(''):'<p class="muted">No conversations yet.</p>');
if(or.error)empty('myOffers',or.error.message);else show('myOffers',or.data.length?or.data.map(x=>'<div class="item"><div><strong>'+money(x.amount_paise)+' offer</strong><span class="muted">'+esc(x.status)+'</span><br><a href="product.html?id='+encodeURIComponent(x.listing_id)+'">Open product</a></div></div>').join(''):'<p class="muted">No offers yet.</p>');
const ownListingIds=(lr.data||[]).map(x=>x.id);
if(ownListingIds.length){
 const {data:incoming,error:incomingError}=await db.from('price_offers').select('id,listing_id,amount_paise,status,created_at').in('listing_id',ownListingIds).order('created_at',{ascending:false}).limit(50);
 if(!incomingError&&incoming?.length){
  const section=document.createElement('section');section.innerHTML='<h3 style="font-size:13px;margin:16px 0 4px">Offers on my listings</h3><div>'+incoming.map(x=>'<div class="item"><div><strong>'+money(x.amount_paise)+' incoming offer</strong><span class="muted">'+esc(x.status)+'</span><br><a href="product.html?id='+encodeURIComponent(x.listing_id)+'">View product</a> '+(x.status==='pending'?'<button class="btn lime" data-offer="'+esc(x.id)+'" data-decision="accepted">Accept</button> <button class="btn outline" data-offer="'+esc(x.id)+'" data-decision="declined">Decline</button>':'')+'</div></div>').join('')+'</div>';
  $('myOffers').appendChild(section);
  section.querySelectorAll('[data-offer]').forEach(btn=>btn.addEventListener('click',async()=>{btn.disabled=true;const {error}=await db.rpc('respond_to_offer',{p_offer_id:btn.dataset.offer,p_decision:btn.dataset.decision});if(error){btn.disabled=false;note.textContent=error.message;$('notice').hidden=false;return}run()}));
 }
}
if(ownListingIds.length){
 const [incomingOffers,incomingBids]=await Promise.all([
  db.from('price_offers').select('listing_id,buyer_id,amount_paise,status,created_at').in('listing_id',ownListingIds).in('status',['pending','accepted']).order('created_at',{ascending:false}).limit(100),
  db.from('bids').select('listing_id,bidder_id,amount_paise,created_at').in('listing_id',ownListingIds).order('created_at',{ascending:false}).limit(100)
 ]);
 const interested=new Map();
 (incomingOffers.data||[]).forEach(x=>{const k=x.listing_id+'|'+x.buyer_id;const old=interested.get(k)||{listing_id:x.listing_id,buyer_id:x.buyer_id,offer:null,bid:null};if(!old.offer)old.offer=x.amount_paise;interested.set(k,old)});
 (incomingBids.data||[]).forEach(x=>{const k=x.listing_id+'|'+x.bidder_id;const old=interested.get(k)||{listing_id:x.listing_id,buyer_id:x.bidder_id,offer:null,bid:null};if(old.bid===null)old.bid=x.amount_paise;interested.set(k,old)});
 const people=[...interested.values()];
 if(people.length){
  const ids=[...new Set(people.map(x=>x.buyer_id))];
  const {data:profiles}=await db.from('public_seller_profiles').select('id,display_name').in('id',ids);
  const names={};(profiles||[]).forEach(p=>names[p.id]=p.display_name);
  const listingNames={};(lr.data||[]).forEach(l=>listingNames[l.id]=l.title);
  const section=document.createElement('section');section.className='panel';section.style.marginTop='16px';
  section.innerHTML='<h2>Interested buyers · you contact first</h2><p class="muted">Buyers appear here after making an offer or bid. Only you, as the seller, can start the chat.</p>'+people.map((x,i)=>'<div class="item"><div><strong>'+esc(names[x.buyer_id]||'Interested buyer')+'</strong><span class="muted">'+esc(listingNames[x.listing_id]||'Your listing')+' · '+(x.offer!==null?'Offer '+money(x.offer):'')+(x.offer!==null&&x.bid!==null?' · ':'')+(x.bid!==null?'Bid '+money(x.bid):'')+'</span><br><button class="btn lime" data-contact="'+i+'">Contact buyer →</button></div></div>').join('');
  $('myConversations').closest('.panel').after(section);
  section.querySelectorAll('[data-contact]').forEach(btn=>btn.addEventListener('click',async()=>{const x=people[Number(btn.dataset.contact)];btn.disabled=true;btn.textContent='Opening chat…';const {data,error}=await db.rpc('seller_contact_interested_buyer',{p_listing_id:x.listing_id,p_buyer_id:x.buyer_id});if(error){btn.disabled=false;btn.textContent='Contact buyer →';$('notice').hidden=false;$('notice').textContent=error.message;return}location.href='messages.html?id='+encodeURIComponent(data)}));
 }
}
if(br.error)empty('myBids',br.error.message);else show('myBids',br.data.length?br.data.map(x=>'<div class="item"><div><strong>'+money(x.amount_paise)+' bid</strong><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span><br><a href="product.html?id='+encodeURIComponent(x.listing_id)+'">Open product</a></div></div>').join(''):'<p class="muted">No bids yet.</p>');
}
$('signOut').addEventListener('click',async()=>{if(db)await db.auth.signOut();location.href='index.html'});run();
</script></body></html>
