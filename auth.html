<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1b"><title>Sign in — Bech De</title><style>
:root{--navy:#090d1b;--lime:#b8e83e;--ink:#151a27;--muted:#727988;--line:#e8eaf0}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font:15px/1.5 Inter,system-ui,Arial,sans-serif}.wrap{width:min(460px,calc(100% - 28px));margin:9vh auto}.brand{font-size:29px;font-weight:950;letter-spacing:-1.5px;color:#fff;text-decoration:none}.brand span{color:var(--lime)}header{background:linear-gradient(110deg,#080b16,#121a30);padding:20px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:25px;margin-top:22px}.card h1{font-size:29px;line-height:1.05;letter-spacing:-1px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #dfe3eb;border-radius:10px;padding:14px;font:inherit}.btn{border:0;border-radius:10px;padding:14px;font-weight:900;cursor:pointer;width:100%;background:var(--lime)}.notice{display:none;margin-top:14px;background:#eff8dc;border-radius:10px;padding:13px;font-size:12px;overflow-wrap:anywhere}.notice.error{background:#fff0ed;color:#8b2e1d}.links{display:flex;justify-content:space-between;margin-top:18px;font-size:12px}.links a{color:#245d9b;text-decoration:none}.small{font-size:11px;color:var(--muted);margin-top:15px}
</style></head><body><header><a class="brand" href="index.html">bech<span>de.</span></a></header><main class="wrap"><section class="card"><h1>Welcome back.<br>Let's get you selling.</h1><p class="muted">Sign in quickly and securely with your Google account.</p><button class="btn" id="googleBtn" type="button">Continue with Google →</button><p class="muted" style="text-align:center;margin:16px 0 4px">Or continue with email</p><form id="authForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><button class="btn" type="submit">Email me a sign-in link →</button></form><div id="notice" class="notice" role="status" aria-live="polite"></div><div class="links"><a href="index.html">← Browse marketplace</a><a href="seller.html">List an item</a></div><p class="small">By continuing, you agree to use Bech De responsibly. Terms and Privacy Policy must be published before public launch.</p></section></main><script src="assets/config.js"></script><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const form=document.getElementById('authForm'),notice=document.getElementById('notice'),googleBtn=document.getElementById('googleBtn');
googleBtn.addEventListener('click',async()=>{
 notice.className='notice';notice.style.display='block';
 if(!window.BECHDE_BACKEND_ENABLED){notice.classList.add('error');notice.textContent='Backend not configured yet. Configure Supabase in assets/config.js first.';return;}
 googleBtn.disabled=true;googleBtn.textContent='Connecting to Google…';
 const client=createClient(window.BECHDE_CONFIG.supabaseUrl,window.BECHDE_CONFIG.supabaseAnonKey);
 const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://an420kit.github.io/bech-de-2.0/account.html'}});
 if(error){notice.classList.add('error');notice.textContent=error.message;googleBtn.disabled=false;googleBtn.textContent='Continue with Google →';}
});
form.addEventListener('submit',async e=>{e.preventDefault();notice.className='notice';notice.style.display='block';if(!window.BECHDE_BACKEND_ENABLED){notice.classList.add('error');notice.textContent='Backend not configured yet. Add your Supabase project URL and publishable/anon key in assets/config.js, then run the SQL migrations in Supabase.';return;}const client=createClient(window.BECHDE_CONFIG.supabaseUrl,window.BECHDE_CONFIG.supabaseAnonKey);const email=document.getElementById('email').value.trim();const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:'https://an420kit.github.io/bech-de-2.0/account.html'}});if(error){notice.classList.add('error');notice.textContent=error.message;return;}notice.textContent='Check your email for the secure sign-in link. You can return to this tab after opening it.';});
</script></body></html>
