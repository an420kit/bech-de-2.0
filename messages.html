<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1b"><title>Messages — LOOP</title><style>
:root{--navy:#090d1b;--lime:#b8e83e;--ink:#151a27;--muted:#727988;--line:#e8eaf0}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font:15px/1.5 Inter,system-ui,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 24px));margin:24px auto}.head{background:var(--navy);color:white;padding:18px;border-radius:14px}.head a{color:var(--lime);text-decoration:none}.chat{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:15px}.messages{height:min(55vh,520px);overflow:auto;display:flex;flex-direction:column;gap:9px}.msg{max-width:85%;background:#f0f2f5;border-radius:12px;padding:10px 12px;font-size:13px;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#e8f6c8}.msg small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.send{display:flex;gap:8px;margin-top:12px}.send input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:12px}.send button{border:0;background:var(--lime);border-radius:9px;padding:12px;font-weight:900}.notice{padding:12px;background:#eff8dc;border-radius:9px;font-size:12px;margin-top:10px}
.chat-brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.chat-brand .brand{color:#fff;text-decoration:none;font-size:26px;font-weight:900}.brand{display:inline-flex;align-items:center;gap:9px}.brand .loopmark{display:inline-grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:#d7ff3f;color:#18231a!important;font-size:25px;font-weight:900;line-height:1;letter-spacing:0}.brand>span:last-child{color:#d7ff3f!important}</style></head><body><main class="wrap"><header class="head"><a href="account.html">← My account</a><h1>Buyer–seller chat</h1><div id="title">Loading conversation…</div></header><section class="chat"><div id="messages" class="messages"></div><form id="sendForm" class="send"><input id="body" maxlength="4000" required placeholder="Write a message…" autocomplete="off"><button>Send</button></form><div id="notice" class="notice" hidden></div></section></main><script src="assets/config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.BECHDE_CONFIG,ready=window.BECHDE_BACKEND_ENABLED,db=ready?createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}}):null;
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let current=null,refreshing=false,lastMessageIds='',pollTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t){$('notice').hidden=false;$('notice').textContent=t}
async function load(){if(!ready){note('Supabase is not configured.');return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='auth.html';return}current=user;if(!id){note('Missing conversation ID.');return}
const {data:conv,error}=await db.from('conversations').select('id,listing_id,buyer_id,seller_id').eq('id',id).maybeSingle();if(error||!conv){note(error?.message||'Conversation not found.');return}
const {data:listing}=await db.from('listings').select('title').eq('id',conv.listing_id).maybeSingle();$('title').textContent=listing?.title||'Listing conversation';await refresh();\n// Realtime for instant updates, with polling fallback in case Realtime is unavailable/not enabled.\ndb.channel('messages-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},()=>refresh()).subscribe();\npollTimer=setInterval(()=>refresh(),2000);\nwindow.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
}
async function refresh(){if(refreshing||!db||!current||!id)return;refreshing=true;try{const box=$('messages'),nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<70;const {data,error}=await db.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',id).order('created_at',{ascending:true}).limit(300);if(error){note(error.message);return}const rows=data||[],signature=rows.map(m=>m.id).join(',');if(signature!==lastMessageIds){box.innerHTML=rows.map(m=>'<div class="msg '+(m.sender_id===current.id?'mine':'')+'">'+esc(m.body)+'<small>'+new Date(m.created_at).toLocaleString()+'</small></div>').join('');lastMessageIds=signature;if(nearBottom||!box.scrollTop)box.scrollTop=box.scrollHeight}}finally{refreshing=false}}
$('sendForm').addEventListener('submit',async e=>{e.preventDefault();const body=$('body').value.trim();if(!body||!current)return;const {error}=await db.from('messages').insert({conversation_id:id,sender_id:current.id,body});if(error)note(error.message);else{$('body').value='';await refresh()}});
load();
</script></body></html>
